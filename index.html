<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>イベントアプリ</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <h1>ポイント交換イベント</h1>

  <!-- あなたの寮 -->
  <h2 id="houseDisplay">あなたの〇〇寮です</h2>

  <!-- 個人ポイント -->
  <h3>あなたの交換ポイント</h3>
  <p id="userPoints">0</p>
  <p id="remainingCount"></p>

  <!-- ボタン -->
  <button onclick="location.href='scan.html'">
    QRを読み取る
  </button>

  <button onclick="location.href='progress.html'">
    寮別イラスト進捗
  </button>

  <button onclick="openRules()">
    ルール説明
  </button>

  <!-- ルールポップ -->
  <div id="rulesModal" class="modal">
    <div class="modal-content">
      <h2>イベントルール</h2>

      <div class="rules-text">
        <p>① 参加者同士でQRコードを交換してポイントをためます</p>
        <p>② 交換した人数に応じて寮のイラストが完成していきます</p>
        <p>③ イラスト完成度が一番高い寮に景品があります</p>
        <p>④ 交換した回数（個人ポイント）が多い人にも景品があります</p>
        <p>⑤ 「QRを読み取る」から相手のQRを読み込んでください</p>
        <p>⑥ 1人あたり最大5人まで交換できます</p>
      </div>

      <button onclick="closeRules()">とじる</button>
    </div>
  </div>

  <!-- Firebase & App -->
  <script type="module">
    import "./firebase.js";
    import "./app.js";
  </script>

  <!-- ルール用JS -->
  <script>
    function openRules() {
      document.getElementById("rulesModal").style.display = "block";
    }

    function closeRules() {
      document.getElementById("rulesModal").style.display = "none";
    }
  </script>

</body>
</html>

<script type="module">
  import { auth, db } from "./firebase.js";
  import { registerUser } from "./app.js";
  import { doc, onSnapshot } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const HOUSE_NAME = {
    gryffindor: "グリフィンドール",
    slytherin: "スリザリン",
    ravenclaw: "レイブンクロー",
    hufflepuff: "ハッフルパフ"
  };

  auth.onAuthStateChanged(async user => {
    if (!user) return;

    await registerUser(user.uid);

    const ref = doc(db, "users", user.uid);

    // ★ リアルタイム監視に変更
    onSnapshot(ref, snap => {
      if (!snap.exists()) return;

      const data = snap.data();

      document.getElementById("my-house").textContent =
        `あなたは「${HOUSE_NAME[data.house]}」です`;

      document.getElementById("my-points").textContent =
        `あなたの個人ポイント：${data.points ?? 0} pt`;
    });

    const qrcodeEl = document.getElementById("qrcode");
    qrcodeEl.innerHTML = "";
    new QRCode(qrcodeEl, {
      text: user.uid,
      width: 240,
      height: 240
    });
  });
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Magic Mosaic Event</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b1b1b">

  <!-- QRコード生成 -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-top: 10px;
    }

    #my-house {
      margin-top: 10px;
      font-size: 18px;
    }

    #my-points {
      margin-top: 6px;
      font-size: 16px;
      opacity: 0.9;
    }

    #qrcode {
      background: #fff;
      padding: 12px;
      width: fit-content;
      margin: 20px auto;
      border-radius: 10px;
    }

    .btn {
      display: block;
      margin: 14px auto;
      padding: 14px;
      width: 80%;
      max-width: 320px;
      background: #1b1b1b;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 16px;
      border: none;
    }
  </style>
</head>

<body>

<h1>マイQRコード</h1>

<p id="my-house">読み込み中...</p>
<p id="my-points"></p>

<div id="qrcode"></div>

<a href="scan.html" class="btn">QRを読み取る</a>
<a href="progress.html" class="btn">寮別イラスト進捗を見る</a>
<button id="ruleBtn" class="btn">ルール説明</button>

<!-- ルール説明モーダル -->
<div id="ruleModal" style="
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  z-index:1000;
  color:#fff;
">
  <div style="
    background:#111;
    margin:10vh auto;
    padding:20px;
    width:90%;
    max-width:400px;
    border-radius:12px;
    text-align:left;
  ">
    <h2 style="text-align:center;">イベントルール</h2>

    <ol style="line-height:1.6;">
      <li>参加者同士でQRコードを交換してポイントをためよう</li>
      <li>交換した人数に応じて、寮のイラストが完成していきます</li>
      <li>イラストの完成度が一番高い寮に景品をプレゼント！</li>
      <li>さらに、交換回数（個人ポイント）が多い人にも景品があります</li>
    </ol>

    <button id="closeRule" class="btn" style="width:100%;">
      閉じる
    </button>
  </div>
</div>

<script type="module">
  import { auth, db } from "./firebase.js";
  import { registerUser } from "./app.js";
  import {
    doc,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const HOUSE_NAME = {
    gryffindor: "グリフィンドール",
    slytherin: "スリザリン",
    ravenclaw: "レイブンクロー",
    hufflepuff: "ハッフルパフ"
  };

  auth.onAuthStateChanged(async user => {
    if (!user) {
      document.getElementById("my-house").textContent = "ログイン中...";
      return;
    }

    // 初回登録
    await registerUser(user.uid);

    // ユーザー情報をリアルタイム監視
    const userRef = doc(db, "users", user.uid);
    onSnapshot(userRef, snap => {
      if (!snap.exists()) return;
      const data = snap.data();

      document.getElementById("my-house").textContent =
        `あなたは「${HOUSE_NAME[data.house]}」です`;

      document.getElementById("my-points").textContent =
        `あなたの個人ポイント：${data.points ?? 0} pt`;
    });

    // QRコード生成（1回だけ）
    const qr = document.getElementById("qrcode");
    qr.innerHTML = "";
    new QRCode(qr, {
      text: user.uid,
      width: 240,
      height: 240
    });
  });

  // ルール説明モーダル制御
  document.getElementById("ruleBtn").onclick = () => {
    document.getElementById("ruleModal").style.display = "block";
  };

  document.getElementById("closeRule").onclick = () => {
    document.getElementById("ruleModal").style.display = "none";
  };

  // PWA
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>

</body>
</html>

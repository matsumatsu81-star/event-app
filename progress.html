<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>寮別イラスト進捗</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  background: #111;
  color: #fff;
  font-family: sans-serif;
  margin: 0;
  padding: 20px;
  text-align: center;
  overflow-x: hidden;
}

h1 {
  margin-bottom: 20px;
}

.house {
  margin-bottom: 30px;
  transition: 0.4s;
}

.house.winner {
  transform: scale(1.2);
  box-shadow: 0 0 25px gold;
}

.img-wrap {
  width: 200px;
  margin: 0 auto;
  overflow: hidden;
  border-radius: 10px;
  background: #000;
}

.img-wrap img {
  width: 100%;
  display: block;
}

.percent {
  margin-top: 6px;
  font-size: 14px;
}

/* 優勝テキスト（中央） */
#winnerText {
  position: fixed;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 42px;
  font-weight: bold;
  color: gold;
  display: none;
  z-index: 1000;
}

/* 紙吹雪 */
.confetti {
  position: fixed;
  width: 8px;
  height: 12px;
  top: -10px;
  animation: fall linear forwards;
  z-index: 999;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
  }
}

.back-btn {
  display: block;
  margin: 30px auto 0;
  padding: 14px;
  width: 80%;
  max-width: 320px;
  background: #1b1b1b;
  color: white;
  text-decoration: none;
  border-radius: 10px;
}
</style>
</head>

<body>

<h1>寮別イラスト進捗</h1>

<div id="houses"></div>
<div id="winnerText"></div>

<a href="index.html" class="back-btn">トップへ戻る</a>

<script type="module">
import { db } from "./firebase.js";
import { doc, onSnapshot, getDoc } from
  "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const HOUSE_INFO = {
  gryffindor: { name: "グリフィンドール", img: "gryffindor.png" },
  slytherin: { name: "スリザリン", img: "slytherin.png" },
  ravenclaw: { name: "レイブンクロー", img: "ravenclaw.png" },
  hufflepuff: { name: "ハッフルパフ", img: "hufflepuff.png" }
};

const MAX_POINTS = 625;
const container = document.getElementById("houses");

let isLocked = false;
let confettiStarted = false;

/* =========================
   ★ final優先
========================= */

const finalRef = doc(db, "scores", "final");
const finalSnap = await getDoc(finalRef);

if (finalSnap.exists()) {
  isLocked = true;
  render(finalSnap.data());
  showWinner(finalSnap.data());
} else {
  onSnapshot(doc(db, "scores", "houses"), snap => {
    if (!snap.exists()) return;
    if (isLocked) return;

    render(snap.data());
  });
}

/* =========================
   ★ 描画
========================= */

function render(data) {
  container.innerHTML = "";

  for (const key in HOUSE_INFO) {
    const point = data[key] || 0;
    const percent = Math.min((point / MAX_POINTS) * 100, 100);

    const div = document.createElement("div");
    div.className = "house";
    div.id = key;

    div.innerHTML = `
      <h2>${HOUSE_INFO[key].name}</h2>
      <div class="img-wrap">
        <img src="${HOUSE_INFO[key].img}"
             style="clip-path: inset(${100 - percent}% 0 0 0);">
      </div>
      <div class="percent">${percent.toFixed(1)}%</div>
    `;

    container.appendChild(div);
  }
}

/* =========================
   ★ 優勝演出
========================= */

function showWinner(data) {
  let max = 0;
  let winner = null;

  for (const key in data) {
    if (data[key] > max) {
      max = data[key];
      winner = key;
    }
  }

  if (!winner) return;

  document.getElementById(winner).classList.add("winner");

  const text = document.getElementById("winnerText");
  text.innerText = `🏆 優勝：${HOUSE_INFO[winner].name}`;
  text.style.display = "block";

  startConfettiLoop(); // ★ ループ開始
}

/* =========================
   ★ 紙吹雪（ループ版）
========================= */

function startConfettiLoop() {
  if (confettiStarted) return;
  confettiStarted = true;

  setInterval(() => {
    launchConfetti();
  }, 800); // ←頻度調整OK
}

function launchConfetti() {
  const colors = ["#ff0", "#f00", "#0ff", "#0f0", "#fff"];

  for (let i = 0; i < 40; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (2 + Math.random() * 2) + "s";

    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>寮別イラスト進捗</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
      overflow-x: hidden;
    }

    h1 {
      margin-bottom: 20px;
    }

    .house {
      margin-bottom: 30px;
      transition: all 0.5s ease;
    }

    .house h2 {
      margin-bottom: 10px;
    }

    .img-wrap {
      width: 200px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 10px;
      background: #000;
    }

    .img-wrap img {
      width: 100%;
      display: block;
    }

    .percent {
      margin-top: 6px;
      font-size: 14px;
      opacity: 0.85;
    }

    /* ★ 勝者演出 */
    .winner {
      transform: scale(1.2);
      box-shadow: 0 0 30px gold;
    }

    /* ★ 結果テキスト */
    #result {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 32px;
      font-weight: bold;
      display: none;
      animation: pop 0.8s ease;
    }

    @keyframes pop {
      0% { transform: translate(-50%, -60%) scale(0.5); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
  </style>
</head>

<body>

<h1>寮別イラスト進捗</h1>

<div id="houses"></div>

<div id="result"></div>

<script type="module">
  import { db } from "./firebase.js";
  import { doc, onSnapshot } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const HOUSE_INFO = {
    gryffindor: { name: "グリフィンドール", img: "gryffindor.png" },
    slytherin: { name: "スリザリン", img: "slytherin.png" },
    ravenclaw: { name: "レイブンクロー", img: "ravenclaw.png" },
    hufflepuff: { name: "ハッフルパフ", img: "hufflepuff.png" }
  };

  const MAX_POINTS = 500;

  const container = document.getElementById("houses");

  let finished = false; // ★ 一度だけ演出

  function isAfter1430() {
    const now = new Date();
    return now.getHours() > 14 || (now.getHours() === 14 && now.getMinutes() >= 30);
  }

  onSnapshot(doc(db, "scores", "houses"), snap => {
    const data = snap.data();
    container.innerHTML = "";

    let max = 0;
    let winnerKey = null;

    for (const key in HOUSE_INFO) {
      const point = data[key] || 0;
      if (point > max) {
        max = point;
        winnerKey = key;
      }
    }

    for (const key in HOUSE_INFO) {
      const point = data[key] || 0;
      const percent = Math.min((point / MAX_POINTS) * 100, 100);

      const div = document.createElement("div");
      div.className = "house";
      div.id = key;

      div.innerHTML = `
        <h2>${HOUSE_INFO[key].name}</h2>
        <div class="img-wrap">
          <img src="${HOUSE_INFO[key].img}"
               style="clip-path: inset(${100 - percent}% 0 0 0);">
        </div>
        <div class="percent">${Math.floor(percent)}%</div>
      `;

      container.appendChild(div);
    }

    // ★ 14:30以降の演出
    if (isAfter1430() && !finished && winnerKey) {
      finished = true;

      // 勝者強調
      document.getElementById(winnerKey).classList.add("winner");

      // 結果表示
      const result = document.getElementById("result");
      result.textContent = `🏆 優勝：${HOUSE_INFO[winnerKey].name}`;
      result.style.display = "block";
    }
  });
</script>

</body>
</html>

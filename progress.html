<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>寮別イラスト進捗</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  background: #111;
  color: #fff;
  font-family: sans-serif;
  margin: 0;
  padding: 20px;
  text-align: center;
}

.house {
  margin-bottom: 30px;
}

.img-wrap {
  width: 200px;
  margin: 0 auto;
  overflow: hidden;
  border-radius: 10px;
  background: #000;
}

.img-wrap img {
  width: 100%;
}

.percent {
  margin-top: 6px;
}

/* ★ 優勝表示 */
#winner {
  font-size: 28px;
  margin: 20px 0;
  color: gold;
  display: none;
}

/* ★ 紙吹雪 */
.confetti {
  position: fixed;
  top: -10px;
  width: 8px;
  height: 14px;
  opacity: 0.8;
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
  }
}
</style>
</head>

<body>

<h1>寮別イラスト進捗</h1>

<div id="winner"></div>
<div id="houses"></div>

<script type="module">
import { db } from "./firebase.js";
import { doc, onSnapshot, getDoc } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const HOUSE_INFO = {
  gryffindor: "グリフィンドール",
  slytherin: "スリザリン",
  ravenclaw: "レイブンクロー",
  hufflepuff: "ハッフルパフ"
};

const MAX_POINTS = 15;
const container = document.getElementById("houses");
const winnerEl = document.getElementById("winner");

let isLocked = false;
let confettiStarted = false;

/* =========================
   ★ 紙吹雪（ループ）
========================= */
function startConfetti() {
  if (confettiStarted) return;
  confettiStarted = true;

  setInterval(() => {
    for (let i = 0; i < 20; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = `hsl(${Math.random()*360},100%,50%)`;
      c.style.animationDuration = (2 + Math.random()*2) + "s";

      document.body.appendChild(c);

      setTimeout(() => c.remove(), 4000);
    }
  }, 800);
}

/* =========================
   ★ 勝者判定
========================= */
function showWinner(data) {
  let max = 0;
  let winnerKey = null;

  for (const key in data) {
    if (data[key] > max) {
      max = data[key];
      winnerKey = key;
    }
  }

  if (winnerKey) {
    winnerEl.textContent = `🏆 優勝！ ${HOUSE_INFO[winnerKey]}`;
    winnerEl.style.display = "block";
    startConfetti();
  }
}

/* =========================
   ★ final優先
========================= */
const finalRef = doc(db, "scores", "final");
const finalSnap = await getDoc(finalRef);

if (finalSnap.exists()) {
  isLocked = true;
  const data = finalSnap.data();
  render(data);
  showWinner(data);
} else {
  onSnapshot(doc(db, "scores", "houses"), snap => {
    if (!snap.exists() || isLocked) return;
    render(snap.data());
  });
}

/* =========================
   ★ 描画
========================= */
function render(data) {
  container.innerHTML = "";

  for (const key in HOUSE_INFO) {
    const point = data[key] || 0;
    const percent = Math.min((point / MAX_POINTS) * 100, 100);

    const div = document.createElement("div");
    div.className = "house";

    div.innerHTML = `
      <h2>${HOUSE_INFO[key]}</h2>
      <div class="img-wrap">
        <img src="${key}.png"
             style="clip-path: inset(${100 - percent}% 0 0 0);">
      </div>
      <div class="percent">${percent.toFixed(1)}%</div>
    `;

    container.appendChild(div);
  }
}
</script>

</body>
</html>

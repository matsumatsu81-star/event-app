<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>寮別イラスト進捗</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    .house {
      margin-bottom: 30px;
    }

    .house h2 {
      margin-bottom: 10px;
    }

    .img-wrap {
      width: 200px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 10px;
      background: #000;
    }

    .img-wrap img {
      width: 100%;
      display: block;
    }

    .percent {
      margin-top: 6px;
      font-size: 14px;
      opacity: 0.85;
    }

    .back-btn {
      display: block;
      margin: 30px auto 0;
      padding: 14px;
      width: 80%;
      max-width: 320px;
      background: #1b1b1b;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<h1>寮別イラスト進捗</h1>

<div id="houses"></div>

<a href="index.html" class="back-btn">トップへ戻る</a>

<script type="module">
  import { db } from "./firebase.js";
  import { doc, onSnapshot } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const HOUSE_INFO = {
    gryffindor: { name: "グリフィンドール", img: "gryffindor.png" },
    slytherin: { name: "スリザリン", img: "slytherin.png" },
    ravenclaw: { name: "レイブンクロー", img: "ravenclaw.png" },
    hufflepuff: { name: "ハッフルパフ", img: "hufflepuff.png" }
  };

  const MAX_POINTS = 15;

  const container = document.getElementById("houses");

  onSnapshot(doc(db, "scores", "houses"), snap => {
    const data = snap.data();
    container.innerHTML = "";

    for (const key in HOUSE_INFO) {
      const point = data[key] || 0;
      const percent = Math.min((point / MAX_POINTS) * 100, 100);

      const div = document.createElement("div");
      div.className = "house";

      div.innerHTML = `
        <h2>${HOUSE_INFO[key].name}</h2>
        <div class="img-wrap">
          <img src="${HOUSE_INFO[key].img}"
               style="clip-path: inset(${100 - percent}% 0 0 0);">
        </div>
        <div class="percent">${percent.toFixed(1)}%</div>
      `;

      container.appendChild(div);
    }
  });
</script>

</body>
</html>

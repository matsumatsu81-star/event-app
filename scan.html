<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>QRスキャン</title>
</head>
<body>
  <h2>QRコードを読み取ってください</h2>
  <video id="preview" style="width:100%; max-width:400px;"></video>

  <script type="module">
    import { addPoint } from "./app.js";
    import QrScanner from "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";

    const video = document.getElementById("preview");

    const scanner = new QrScanner(
      video,
      result => {
        console.log("読み取り結果:", result.data);

        const house = result.data.toLowerCase();
        addPoint(house);

        scanner.stop();
        alert("読み取り完了！");
      },
      {
        returnDetailedScanResult: true
      }
    );

    scanner.start().catch(err => {
      alert("カメラ起動に失敗しました");
      console.error(err);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>QRスキャン</title>
</head>
<body>
  <h2>QRコードを読み取ってください</h2>
  <video id="preview" style="width:100%; max-width:400px;"></video>

  <script type="module">
    import { addPoint } from "./app.js";
    import QrScanner from "./qr-scanner.min.js";

    QrScanner.WORKER_PATH = "./qr-scanner-worker.min.js";

    const video = document.getElementById("preview");

    const scanner = new QrScanner(
      video,
      result => {
        const house = result.toLowerCase();
        addPoint(house);
        scanner.stop();
        alert("読み取り完了！");
      }
    );

    scanner.start().catch(err => {
      console.error(err);
      alert("カメラが起動できません");
    });
  </script>
</body>
</html>

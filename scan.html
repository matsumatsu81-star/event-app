<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>QRを読み取る</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- QR読み取りライブラリ -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      transition: background 0.2s ease;
    }

    h1 {
      margin: 16px 0;
      font-size: 20px;
    }

    #reader {
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .msg {
      margin-top: 12px;
      font-size: 14px;
      opacity: 0.9;
    }

    .btn {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 20px;
      background: #1b1b1b;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-size: 15px;
    }
  </style>
</head>

<body>

<h1>QRコードを読み取って交換</h1>

<div id="reader"></div>
<div class="msg" id="status">カメラを起動しています…</div>

<a href="index.html" class="btn">トップへ戻る</a>

<script type="module">
  import { auth } from "./firebase.js";
  import { exchange } from "./app.js";

  let myUid = null;
  let scanning = true;

  // ★ 追加：連続スキャン防止
  let lastScanTime = 0;
  const SCAN_COOLDOWN = 2000; // 2秒

  auth.onAuthStateChanged(user => {
    if (!user) {
      document.getElementById("status").textContent =
        "認証に失敗しました。トップへ戻ってください。";
      return;
    }
    myUid = user.uid;
    startScan();
  });

  function flashEffect() {
    document.body.style.background = "#064";
    setTimeout(() => {
      document.body.style.background = "#000";
    }, 200);
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function startScan() {
    const html5QrCode = new Html5Qrcode("reader");

    Html5Qrcode.getCameras().then(devices => {
      if (!devices || devices.length === 0) {
        document.getElementById("status").textContent =
          "カメラが見つかりません";
        return;
      }

      html5QrCode.start(
        { facingMode: "environment" },
        {
          fps: 8, // ★ 少し下げて負荷軽減
          qrbox: { width: 250, height: 250 }
        },
        async decodedText => {

          const now = Date.now();

          // ★ クールダウン中は無視
          if (now - lastScanTime < SCAN_COOLDOWN) return;
          lastScanTime = now;

          if (!scanning) return;
          scanning = false;

          document.getElementById("status").textContent =
            "交換処理中…";

          try {
            // ★ 少し待機（集中アクセス防止）
            await sleep(300);

            const result = await exchange(myUid, decodedText);

            if (result) {
              document.getElementById("status").textContent =
                "交換成立しました！";

              flashEffect();

              if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100]);
              }

              // ★ 成功時は完全停止
              html5QrCode.stop();

            } else {
              document.getElementById("status").textContent =
                "交換できませんでした";

              // ★ 少し待ってから再開（連打防止）
              await sleep(1000);
              scanning = true;
            }

          } catch (e) {
            console.error(e);
            document.getElementById("status").textContent =
              "エラーが発生しました";

            await sleep(1000);
            scanning = true;
          }
        }
      );
    }).catch(err => {
      console.error(err);
      document.getElementById("status").textContent =
        "カメラの起動に失敗しました";
    });
  }
</script>

</body>
</html>

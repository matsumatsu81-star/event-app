<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>寮対抗 イラスト完成度</title>

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 40px;
    }

    .house {
      text-align: center;
    }

    .house h2 {
      margin-bottom: 12px;
      font-size: 26px;
    }

    .img-wrap {
      width: 100%;
      max-width: 340px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 18px;
      background: #000;
    }

    .img-wrap img {
      width: 100%;
      display: block;
    }

    .percent {
      margin-top: 10px;
      font-size: 22px;
      opacity: 0.9;
    }
  </style>
</head>

<body>

<h1>寮対抗 イラスト完成度</h1>

<div class="grid" id="houses"></div>

<script type="module">
  import { db } from "./firebase.js";
  import { doc, onSnapshot } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const HOUSE_INFO = {
    gryffindor: { name: "グリフィンドール", img: "gryffindor.png" },
    slytherin: { name: "スリザリン", img: "slytherin.png" },
    ravenclaw: { name: "レイブンクロー", img: "ravenclaw.png" },
    hufflepuff: { name: "ハッフルパフ", img: "hufflepuff.png" }
  };

  const MAX_POINTS = 15;

  const container = document.getElementById("houses");

  onSnapshot(doc(db, "scores", "houses"), snap => {
    const data = snap.data();
    container.innerHTML = "";

    for (const key in HOUSE_INFO) {
      const point = data[key] || 0;
      const percent = Math.min((point / MAX_POINTS) * 100, 100);

      const div = document.createElement("div");
      div.className = "house";

      div.innerHTML = `
        <h2>${HOUSE_INFO[key].name}</h2>
        <div class="img-wrap">
          <img src="${HOUSE_INFO[key].img}"
               style="clip-path: inset(${100 - percent}% 0 0 0);">
        </div>
        <div class="percent">${Math.floor(percent)}%</div>
      `;

      container.appendChild(div);
    }
  });
</script>

</body>
</html>

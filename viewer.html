<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>寮別イラスト進捗</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin: 0;
  background: #000;
  font-family: sans-serif;
  color: white;
  text-align: center;
}

h1 {
  margin-top: 40px;
  font-size: 48px;
  letter-spacing: 4px;
}

.container {
  margin-top: 40px;
  display: grid;
  grid-template-columns: 350px 350px;
  grid-template-rows: 350px 350px;
  gap: 70px;
  justify-content: center;
}

.card {
  position: relative;
  background: #1e1e1e;
  border-radius: 40px;
  overflow: hidden;
}

.fill {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0%;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center bottom;
  transition: height 0.8s ease;
}

.percent {
  position: absolute;
  bottom: 20px;
  width: 100%;
  font-size: 50px;
  font-weight: bold;
}

.card.active {
  box-shadow: 0 0 60px 20px gold;
}
</style>
</head>

<body>

<h1>寮別イラスト進捗</h1>

<div class="container">

  <div class="card" id="gryffindor">
    <div class="fill" id="gryffindorFill" style="background-image:url('gryffindor.png')"></div>
    <div class="percent" id="gryffindorPercent">0%</div>
  </div>

  <div class="card" id="slytherin">
    <div class="fill" id="slytherinFill" style="background-image:url('slytherin.png')"></div>
    <div class="percent" id="slytherinPercent">0%</div>
  </div>

  <div class="card" id="ravenclaw">
    <div class="fill" id="ravenclawFill" style="background-image:url('ravenclaw.png')"></div>
    <div class="percent" id="ravenclawPercent">0%</div>
  </div>

  <div class="card" id="hufflepuff">
    <div class="fill" id="hufflepuffFill" style="background-image:url('hufflepuff.png')"></div>
    <div class="percent" id="hufflepuffPercent">0%</div>
  </div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCjvBWgetJj8I_9D5RY1jyz05zSZjD6ZfM",
  authDomain: "enji-event2025.firebaseapp.com",
  projectId: "enji-event2025",
  storageBucket: "enji-event2025.firebasestorage.app",
  messagingSenderId: "1097616247056",
  appId: "1:1097616247056:web:a3ff71fb020289df43fd95"
};

console.log("Project ID:", firebaseConfig.projectId);

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const MAX_POINTS = 15;

db.collection("scores").doc("houses")
.onSnapshot((doc) => {

  if (!doc.exists) {
    console.log("houses document not found");
    return;
  }

  const data = doc.data();
  console.log("Connected data:", data);

  const gryffindor = data.gryffindor || 0;
  const slytherin = data.slytherin || 0;
  const ravenclaw = data.ravenclaw || 0;
  const hufflepuff = data.hufflepuff || 0;

  const gP = Math.floor((gryffindor / MAX_POINTS) * 100);
  const sP = Math.floor((slytherin / MAX_POINTS) * 100);
  const rP = Math.floor((ravenclaw / MAX_POINTS) * 100);
  const hP = Math.floor((hufflepuff / MAX_POINTS) * 100);

  document.getElementById("gryffindorPercent").innerText = gP + "%";
  document.getElementById("slytherinPercent").innerText = sP + "%";
  document.getElementById("ravenclawPercent").innerText = rP + "%";
  document.getElementById("hufflepuffPercent").innerText = hP + "%";

  document.getElementById("gryffindorFill").style.height = gP + "%";
  document.getElementById("slytherinFill").style.height = sP + "%";
  document.getElementById("ravenclawFill").style.height = rP + "%";
  document.getElementById("hufflepuffFill").style.height = hP + "%";

  const max = Math.max(gryffindor, slytherin, ravenclaw, hufflepuff);
  document.querySelectorAll(".card").forEach(card => card.classList.remove("active"));

  if (gryffindor === max && max !== 0) document.getElementById("gryffindor").classList.add("active");
  if (slytherin === max && max !== 0) document.getElementById("slytherin").classList.add("active");
  if (ravenclaw === max && max !== 0) document.getElementById("ravenclaw").classList.add("active");
  if (hufflepuff === max && max !== 0) document.getElementById("hufflepuff").classList.add("active");

});
</script>

</body>
</html>

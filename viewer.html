<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>寮別イラスト進捗</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin: 0;
  background: #000;
  font-family: sans-serif;
  color: white;
  text-align: center;
}

h1 {
  margin-top: 40px;
  font-size: 48px;
}

.container {
  margin-top: 40px;
  display: grid;
  grid-template-columns: 350px 350px;
  grid-template-rows: 350px 350px;
  gap: 70px;
  justify-content: center;
}

.card {
  background: #1e1e1e;
  border-radius: 40px;
  padding: 20px;
}

.img-wrap {
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 30px;
}

.img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: clip-path 0.8s ease;
}

.percent {
  margin-top: 15px;
  font-size: 40px;
  font-weight: bold;
}

.card.active {
  box-shadow: 0 0 60px 20px gold;
}
</style>
</head>

<body>

<h1>寮別イラスト進捗</h1>

<div class="container">

  <div class="card" id="gryffindor">
    <div class="img-wrap">
      <img id="gryffindorImg" src="gryffindor.png">
    </div>
    <div class="percent" id="gryffindorPercent">0%</div>
  </div>

  <div class="card" id="slytherin">
    <div class="img-wrap">
      <img id="slytherinImg" src="slytherin.png">
    </div>
    <div class="percent" id="slytherinPercent">0%</div>
  </div>

  <div class="card" id="ravenclaw">
    <div class="img-wrap">
      <img id="ravenclawImg" src="ravenclaw.png">
    </div>
    <div class="percent" id="ravenclawPercent">0%</div>
  </div>

  <div class="card" id="hufflepuff">
    <div class="img-wrap">
      <img id="hufflepuffImg" src="hufflepuff.png">
    </div>
    <div class="percent" id="hufflepuffPercent">0%</div>
  </div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCjvBWgetJj8I_9D5RY1jyz05zSZjD6ZfM",
  authDomain: "enji-event2025.firebaseapp.com",
  projectId: "enji-event2025",
  storageBucket: "enji-event2025.firebasestorage.app",
  messagingSenderId: "1097616247056",
  appId: "1:1097616247056:web:a3ff71fb020289df43fd95"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const MAX_POINTS = 500;

db.collection("scores").doc("houses")
.onSnapshot((doc) => {

  if (!doc.exists) return;

  const data = doc.data();

  const gryffindor = data.gryffindor || 0;
  const slytherin = data.slytherin || 0;
  const ravenclaw = data.ravenclaw || 0;
  const hufflepuff = data.hufflepuff || 0;

  updateHouse("gryffindor", gryffindor);
  updateHouse("slytherin", slytherin);
  updateHouse("ravenclaw", ravenclaw);
  updateHouse("hufflepuff", hufflepuff);

  const max = Math.max(gryffindor, slytherin, ravenclaw, hufflepuff);
  document.querySelectorAll(".card").forEach(card => card.classList.remove("active"));

  if (gryffindor === max && max !== 0) document.getElementById("gryffindor").classList.add("active");
  if (slytherin === max && max !== 0) document.getElementById("slytherin").classList.add("active");
  if (ravenclaw === max && max !== 0) document.getElementById("ravenclaw").classList.add("active");
  if (hufflepuff === max && max !== 0) document.getElementById("hufflepuff").classList.add("active");
});

function updateHouse(id, point) {
  const percent = Math.min((point / MAX_POINTS) * 100, 100);
  document.getElementById(id + "Percent").innerText = Math.floor(percent) + "%";

  // 上から隠す（progress.htmlと同じ）
  document.getElementById(id + "Img")
    .style.clipPath = `inset(${100 - percent}% 0 0 0)`;
}
</script>

</body>
</html>

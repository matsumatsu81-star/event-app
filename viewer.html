<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>寮対抗 結果発表</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin: 0;
  background: #000;
  color: white;
  font-family: sans-serif;
  text-align: center;
  overflow: hidden;
}

/* 通常表示 */
#main {
  transition: opacity 1s;
}

.container {
  margin-top: 40px;
  display: grid;
  grid-template-columns: 350px 350px;
  grid-template-rows: 350px 350px;
  gap: 70px;
  justify-content: center;
}

.card {
  background: #1e1e1e;
  border-radius: 40px;
  padding: 20px;
}

.img-wrap {
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 30px;
}

.img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: clip-path 0.8s ease;
}

.percent {
  margin-top: 15px;
  font-size: 40px;
  font-weight: bold;
}

/* 結果発表画面 */
#resultScreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

#winnerImg {
  width: 400px;
  animation: zoom 1s ease;
}

#winnerName {
  font-size: 60px;
  margin-top: 20px;
  color: gold;
  animation: glow 1.5s infinite alternate;
}

@keyframes zoom {
  0% { transform: scale(0.5); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes glow {
  from { text-shadow: 0 0 10px gold; }
  to { text-shadow: 0 0 30px gold; }
}

/* 紙吹雪 */
.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  background: red;
  top: -10px;
  animation: fall linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
  }
}
</style>
</head>

<body>

<div id="main">
  <h1>寮対抗 イラスト完成度</h1>

  <div class="container">
    <div class="card"><img id="gryffindorImg" src="gryffindor.png"><div id="gryffindorPercent"></div></div>
    <div class="card"><img id="slytherinImg" src="slytherin.png"><div id="slytherinPercent"></div></div>
    <div class="card"><img id="ravenclawImg" src="ravenclaw.png"><div id="ravenclawPercent"></div></div>
    <div class="card"><img id="hufflepuffImg" src="hufflepuff.png"><div id="hufflepuffPercent"></div></div>
  </div>
</div>

<!-- 結果発表 -->
<div id="resultScreen">
  <img id="winnerImg">
  <div id="winnerName"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "enji-event2025.firebaseapp.com",
  projectId: "enji-event2025"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const MAX_POINTS = 15;

const HOUSE_INFO = {
  gryffindor: { name: "グリフィンドール", img: "gryffindor.png" },
  slytherin: { name: "スリザリン", img: "slytherin.png" },
  ravenclaw: { name: "レイブンクロー", img: "ravenclaw.png" },
  hufflepuff: { name: "ハッフルパフ", img: "hufflepuff.png" }
};

let finished = false;

function isAfter1430() {
  const now = new Date();
  return now.getHours() > 14 || (now.getHours() === 14 && now.getMinutes() >= 30);
}

function showResult(winner) {
  document.getElementById("main").style.opacity = 0;

  setTimeout(() => {
    document.getElementById("main").style.display = "none";
    document.getElementById("resultScreen").style.display = "flex";

    document.getElementById("winnerImg").src = HOUSE_INFO[winner].img;
    document.getElementById("winnerName").textContent = "🏆 優勝：" + HOUSE_INFO[winner].name;

    launchConfetti();
  }, 1000);
}

function launchConfetti() {
  for (let i = 0; i < 80; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.animationDuration = (2 + Math.random() * 3) + "s";
    c.style.background = ["red","yellow","blue","green"][Math.floor(Math.random()*4)];
    document.body.appendChild(c);
  }
}

db.collection("scores").doc("houses")
.onSnapshot(doc => {

  const data = doc.data();

  let max = 0;
  let winner = null;

  for (const key in HOUSE_INFO) {
    const p = data[key] || 0;
    if (p > max) {
      max = p;
      winner = key;
    }

    const percent = Math.min((p / MAX_POINTS) * 100, 100);
    document.getElementById(key + "Percent").innerText = Math.floor(percent) + "%";
  }

  if (isAfter1430() && !finished && winner) {
    finished = true;
    showResult(winner);
  }
});
</script>

</body>
</html>

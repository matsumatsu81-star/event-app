<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Score Viewer</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin: 0;
  background: #000;
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* ===== グリッド配置（2×2） ===== */
.container {
  display: grid;
  grid-template-columns: 320px 320px;
  grid-template-rows: 320px 320px;
  gap: 60px;
}

/* ===== カード ===== */
.card {
  position: relative;
  background: #1e1e1e;
  border-radius: 30px;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 0 30px rgba(0,0,0,0.6);
  transition: 0.3s;
}

/* 勝っているカードを光らせる */
.card.active {
  box-shadow: 0 0 50px 15px gold;
}

/* ===== イラスト ===== */
.card img {
  width: 200px;
  height: 200px;
  object-fit: contain;
  pointer-events: none;
}

/* ===== パーセンテージ表示 ===== */
.percent {
  position: absolute;
  bottom: 25px;
  font-size: 48px;
  color: white;
}
</style>
</head>

<body>
<div class="container">

  <div class="card" id="lion">
    <img src="lion.png">
    <div class="percent" id="lionPercent">0%</div>
  </div>

  <div class="card" id="snake">
    <img src="snake.png">
    <div class="percent" id="snakePercent">0%</div>
  </div>

  <div class="card" id="eagle">
    <img src="eagle.png">
    <div class="percent" id="eaglePercent">0%</div>
  </div>

  <div class="card" id="badger">
    <img src="badger.png">
    <div class="percent" id="badgerPercent">0%</div>
  </div>

</div>

<script>
// ===== Firebase設定 =====
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ===== 目標値（15ポイントで100%） =====
const MAX_POINTS = 15;

db.collection("scores").doc("houses")
.onSnapshot((doc) => {

  const data = doc.data();

  const lion = data.lion || 0;
  const snake = data.snake || 0;
  const eagle = data.eagle || 0;
  const badger = data.badger || 0;

  // ===== パーセンテージ計算（切り捨て） =====
  const lionP = Math.floor((lion / MAX_POINTS) * 100);
  const snakeP = Math.floor((snake / MAX_POINTS) * 100);
  const eagleP = Math.floor((eagle / MAX_POINTS) * 100);
  const badgerP = Math.floor((badger / MAX_POINTS) * 100);

  document.getElementById("lionPercent").innerText = lionP + "%";
  document.getElementById("snakePercent").innerText = snakeP + "%";
  document.getElementById("eaglePercent").innerText = eagleP + "%";
  document.getElementById("badgerPercent").innerText = badgerP + "%";

  // ===== 勝者を光らせる =====
  const max = Math.max(lion, snake, eagle, badger);

  document.querySelectorAll(".card").forEach(card => {
    card.classList.remove("active");
  });

  if (lion === max && max !== 0) document.getElementById("lion").classList.add("active");
  if (snake === max && max !== 0) document.getElementById("snake").classList.add("active");
  if (eagle === max && max !== 0) document.getElementById("eagle").classList.add("active");
  if (badger === max && max !== 0) document.getElementById("badger").classList.add("active");

});
</script>

</body>
</html>

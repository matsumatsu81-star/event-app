<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>寮別イラスト進捗</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin: 0;
  background: #000;
  font-family: sans-serif;
  color: white;
  text-align: center;
  overflow: hidden;
}

h1 {
  margin-top: 40px;
  font-size: 48px;
  cursor: pointer;
}

.container {
  margin-top: 40px;
  display: grid;
  grid-template-columns: 350px 350px;
  grid-template-rows: 350px 350px;
  gap: 70px;
  justify-content: center;
}

.card {
  background: #1e1e1e;
  border-radius: 40px;
  padding: 20px;
}

.img-wrap {
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 30px;
}

.img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: clip-path 0.8s ease;
}

.percent {
  margin-top: 15px;
  font-size: 40px;
  font-weight: bold;
}

.card.active {
  box-shadow: 0 0 60px 20px gold;
}

/* ★ 優勝テキスト */
#winnerText {
  position: fixed;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 64px;
  font-weight: bold;
  color: gold;
  display: none;
  z-index: 10;
  animation: pop 0.6s ease;
}

@keyframes pop {
  0% { transform: translate(-50%, -70%) scale(0.5); opacity: 0; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

/* ★ 紙吹雪 */
.confetti {
  position: fixed;
  top: -10px;
  width: 8px;
  height: 14px;
  opacity: 0.9;
  animation: fall linear forwards;
  z-index: 5;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
  }
}

/* 管理パネル */
#adminPanel {
  display: none;
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #111;
  border: 1px solid #555;
  padding: 12px;
  border-radius: 10px;
}
</style>
</head>

<body>

<h1>寮別イラスト進捗</h1>

<div id="winnerText"></div>

<div class="container">
  <div class="card" id="gryffindor">
    <div class="img-wrap">
      <img id="gryffindorImg" src="gryffindor.png">
    </div>
    <div class="percent" id="gryffindorPercent">0%</div>
  </div>

  <div class="card" id="slytherin">
    <div class="img-wrap">
      <img id="slytherinImg" src="slytherin.png">
    </div>
    <div class="percent" id="slytherinPercent">0%</div>
  </div>

  <div class="card" id="ravenclaw">
    <div class="img-wrap">
      <img id="ravenclawImg" src="ravenclaw.png">
    </div>
    <div class="percent" id="ravenclawPercent">0%</div>
  </div>

  <div class="card" id="hufflepuff">
    <div class="img-wrap">
      <img id="hufflepuffImg" src="hufflepuff.png">
    </div>
    <div class="percent" id="hufflepuffPercent">0%</div>
  </div>
</div>

<div id="adminPanel">
  <button onclick="lockProgress()">締切</button>
  <button onclick="unlockProgress()">解除</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "enji-event2025.firebaseapp.com",
  projectId: "enji-event2025",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const MAX_POINTS = 750;

const HOUSE_NAME = {
  gryffindor: "グリフィンドール",
  slytherin: "スリザリン",
  ravenclaw: "レイブンクロー",
  hufflepuff: "ハッフルパフ"
};

let isLocked = false;
let confettiStarted = false;

/* =========================
   ★ final優先ロジック
========================= */

db.collection("scores").doc("final")
.onSnapshot(doc => {
  if (doc.exists) {
    isLocked = true;
    render(doc.data());
    showWinner(doc.data());
  } else {
    isLocked = false;
  }
});

db.collection("scores").doc("houses")
.onSnapshot(doc => {
  if (!doc.exists || isLocked) return;
  render(doc.data());
});

function render(data) {
  const g = data.gryffindor || 0;
  const s = data.slytherin || 0;
  const r = data.ravenclaw || 0;
  const h = data.hufflepuff || 0;

  updateHouse("gryffindor", g);
  updateHouse("slytherin", s);
  updateHouse("ravenclaw", r);
  updateHouse("hufflepuff", h);

  const max = Math.max(g, s, r, h);
  document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));

  if (g === max && max !== 0) document.getElementById("gryffindor").classList.add("active");
  if (s === max && max !== 0) document.getElementById("slytherin").classList.add("active");
  if (r === max && max !== 0) document.getElementById("ravenclaw").classList.add("active");
  if (h === max && max !== 0) document.getElementById("hufflepuff").classList.add("active");
}

function updateHouse(id, point) {
  const percent = Math.min((point / MAX_POINTS) * 100, 100);

  document.getElementById(id + "Percent").innerText =
    percent.toFixed(1) + "%";

  document.getElementById(id + "Img")
    .style.clipPath = `inset(${100 - percent}% 0 0 0)`;
}

/* =========================
   ★ 優勝演出
========================= */

function showWinner(data) {
  const entries = Object.entries(data);
  const winner = entries.reduce((a,b)=> a[1]>b[1]?a:b);

  const text = document.getElementById("winnerText");
  text.innerText = `🏆 優勝！${HOUSE_NAME[winner[0]]}`;
  text.style.display = "block";

  startConfettiLoop();
}

/* ★ 紙吹雪を繰り返し */
function startConfettiLoop() {
  if (confettiStarted) return;
  confettiStarted = true;

  setInterval(() => {
    for (let i = 0; i < 40; i++) {
      createConfetti();
    }
  }, 800);
}

function createConfetti() {
  const el = document.createElement("div");
  el.className = "confetti";

  el.style.left = Math.random() * 100 + "vw";
  el.style.backgroundColor =
    ["#FFD700","#FF3B3B","#4CAF50","#2196F3","#FFEB3B"]
    [Math.floor(Math.random()*5)];

  el.style.animationDuration = (2 + Math.random()*2) + "s";

  document.body.appendChild(el);

  setTimeout(() => el.remove(), 4000);
}

/* =========================
   ★ 管理者機能
========================= */

const ADMIN_PASS = "1234";

let tapCount = 0;
let lastTap = 0;

document.querySelector("h1").addEventListener("click", () => {
  const now = Date.now();

  if (now - lastTap < 1000) {
    tapCount++;
  } else {
    tapCount = 1;
  }

  lastTap = now;

  if (tapCount >= 5) {
    tapCount = 0;

    const input = prompt("パスコード");

    if (input === ADMIN_PASS) {
      document.getElementById("adminPanel").style.display = "block";
    } else {
      alert("違います");
    }
  }
});

function lockProgress() {
  if (!confirm("締切しますか？")) return;

  db.collection("scores").doc("houses").get().then(snap => {
    db.collection("scores").doc("final").set(snap.data());
    alert("締切しました");
  });
}

function unlockProgress() {
  if (!confirm("解除しますか？")) return;

  db.collection("scores").doc("final").delete();
  alert("再開しました");
}
</script>

</body>
</html>

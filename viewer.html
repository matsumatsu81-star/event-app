<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>寮別イラスト進捗</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  background: #000;
  color: white;
  font-family: sans-serif;
  text-align: center;
}
h1 { font-size: 48px; margin: 30px 0; }
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  padding: 40px;
}
.card {
  background: #1e1e1e;
  border-radius: 20px;
  padding: 20px;
}
.image-wrapper {
  position: relative;
  width: 200px;
  height: 200px;
  margin: auto;
}
.image-wrapper img {
  position: absolute;
  width: 100%;
  left: 0;
}
.fill {
  position: absolute;
  bottom: 0;
  width: 100%;
  overflow: hidden;
  transition: height 0.8s ease;
}
.percent {
  font-size: 60px;
  margin-top: 15px;
}
</style>
</head>
<body>

<h1>寮別イラスト進捗</h1>

<div class="grid">
  <div class="card">
    <div class="image-wrapper">
      <img src="./ravenclaw.png" style="filter: grayscale(100%);">
      <div class="fill" id="fill-ravenclaw">
        <img src="./ravenclaw.png">
      </div>
    </div>
    <div class="percent" id="ravenclaw">0%</div>
  </div>
</div>

<script type="module">
import { db } from "./firebase.js";
import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const docRef = doc(db, "scores", "houses");

onSnapshot(docRef, (snapshot) => {
  const data = snapshot.data();
  if (!data) return;

  const total =
    (data.gryffindor || 0) +
    (data.slytherin || 0) +
    (data.ravenclaw || 0) +
    (data.hufflepuff || 0);

  function percent(value) {
    return total === 0 ? 0 : Math.round((value / total) * 100);
  }

  update("ravenclaw", percent(data.ravenclaw || 0));
});

function update(id, value) {
  document.getElementById(id).innerText = value + "%";
  document.getElementById("fill-" + id).style.height = value + "%";
}
</script>

</body>
</html>

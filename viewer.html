<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "あなたのAPIキー",
    authDomain: "あなたのauthDomain",
    projectId: "あなたのprojectId",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const docRef = doc(db, "scores", "houses");

  onSnapshot(docRef, (snapshot) => {
    const data = snapshot.data();

    if (!data) return;

    const total =
      data.gryffindor +
      data.slytherin +
      data.ravenclaw +
      data.hufflepuff;

    function percent(value) {
      return total === 0 ? 0 : Math.round((value / total) * 100);
    }

    document.getElementById("gryffindor").innerText = percent(data.gryffindor) + "%";
    document.getElementById("slytherin").innerText = percent(data.slytherin) + "%";
    document.getElementById("ravenclaw").innerText = percent(data.ravenclaw) + "%";
    document.getElementById("hufflepuff").innerText = percent(data.hufflepuff) + "%";
  });
</script>

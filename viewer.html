<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>寮別イラスト進捗</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #000;
  color: white;
  font-family: sans-serif;
  text-align: center;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

h1 {
  font-size: 48px;
  margin: 30px 0;
}

.grid {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 60px;
}

.card {
  width: 260px;
  padding: 20px;
  border-radius: 20px;
  background: #1e1e1e;
  transition: 0.4s;
}

.card.winner {
  box-shadow: 0 0 40px gold;
  transform: scale(1.05);
}

.image-wrapper {
  position: relative;
  width: 220px;
  height: 220px;
  margin: auto;
}

.image-wrapper img {
  position: absolute;
  width: 100%;
}

.fill {
  position: absolute;
  bottom: 0;
  width: 100%;
  overflow: hidden;
  transition: height 0.8s ease;
}

.percent {
  font-size: 64px;
  margin-top: 20px;
}
</style>
</head>

<body>

<h1>寮別イラスト進捗</h1>

<div class="grid">

  <div class="card" id="card-gryffindor">
    <div class="image-wrapper">
      <img src="./gryffindor.png" style="filter: grayscale(100%);">
      <div class="fill" id="fill-gryffindor">
        <img src="./gryffindor.png">
      </div>
    </div>
    <div class="percent" id="gryffindor">0%</div>
  </div>

  <div class="card" id="card-slytherin">
    <div class="image-wrapper">
      <img src="./slytherin.png" style="filter: grayscale(100%);">
      <div class="fill" id="fill-slytherin">
        <img src="./slytherin.png">
      </div>
    </div>
    <div class="percent" id="slytherin">0%</div>
  </div>

  <div class="card" id="card-ravenclaw">
    <div class="image-wrapper">
      <img src="./ravenclaw.png" style="filter: grayscale(100%);">
      <div class="fill" id="fill-ravenclaw">
        <img src="./ravenclaw.png">
      </div>
    </div>
    <div class="percent" id="ravenclaw">0%</div>
  </div>

  <div class="card" id="card-hufflepuff">
    <div class="image-wrapper">
      <img src="./hufflepuff.png" style="filter: grayscale(100%);">
      <div class="fill" id="fill-hufflepuff">
        <img src="./hufflepuff.png">
      </div>
    </div>
    <div class="percent" id="hufflepuff">0%</div>
  </div>

</div>

<script type="module">
import { db } from "./firebase.js";
import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const docRef = doc(db, "scores", "houses");

onSnapshot(docRef, (snapshot) => {
  const data = snapshot.data();
  if (!data) return;

  const values = {
    gryffindor: data.gryffindor || 0,
    slytherin: data.slytherin || 0,
    ravenclaw: data.ravenclaw || 0,
    hufflepuff: data.hufflepuff || 0
  };

  const total = Object.values(values).reduce((a,b)=>a+b,0);

  let maxPercent = 0;

  for (let key in values) {
    const p = total === 0 ? 0 : Math.round((values[key]/total)*100);
    update(key, p);
    if (p > maxPercent) maxPercent = p;
  }

  // 1位を光らせる
  for (let key in values) {
    const el = document.getElementById("card-" + key);
    const p = total === 0 ? 0 : Math.round((values[key]/total)*100);
    el.classList.toggle("winner", p === maxPercent && p !== 0);
  }

});

function update(id, value) {
  document.getElementById(id).innerText = value + "%";
  document.getElementById("fill-" + id).style.height = value + "%";
}
</script>

</body>
</html>

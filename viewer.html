<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>寮別イラスト進捗</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      margin: 30px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 20px;
      padding: 20px;
      height: calc(100vh - 120px);
    }

    .card {
      background: #1e1e1e;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 28px;
    }

    .card img {
      width: 150px;
      margin-bottom: 20px;
    }

    .percent {
      font-size: 72px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h1>寮別イラスト進捗</h1>

<div class="grid">
  <div class="card">
    <img src="./gryffindor.png">
    <div>グリフィンドール</div>
    <div class="percent" id="gryffindor">0%</div>
  </div>

  <div class="card">
    <img src="./slytherin.png">
    <div>スリザリン</div>
    <div class="percent" id="slytherin">0%</div>
  </div>

  <div class="card">
    <img src="./ravenclaw.png">
    <div>レイブンクロー</div>
    <div class="percent" id="ravenclaw">0%</div>
  </div>

  <div class="card">
    <img src="./hufflepuff.png">
    <div>ハッフルパフ</div>
    <div class="percent" id="hufflepuff">0%</div>
  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "あなたのAPIキー",
    authDomain: "あなたのauthDomain",
    databaseURL: "あなたのdatabaseURL",
    projectId: "あなたのprojectId",
    storageBucket: "あなたのstorageBucket",
    messagingSenderId: "あなたのmessagingSenderId",
    appId: "あなたのappId"
  };

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);

  const votesRef = ref(database, "votes");

  onValue(votesRef, (snapshot) => {
    const data = snapshot.val() || {
      gryffindor: 0,
      slytherin: 0,
      ravenclaw: 0,
      hufflepuff: 0
    };

    const total =
      data.gryffindor +
      data.slytherin +
      data.ravenclaw +
      data.hufflepuff;

    function percent(value) {
      return total === 0 ? 0 : Math.round((value / total) * 100);
    }

    document.getElementById("gryffindor").innerText = percent(data.gryffindor) + "%";
    document.getElementById("slytherin").innerText = percent(data.slytherin) + "%";
    document.getElementById("ravenclaw").innerText = percent(data.ravenclaw) + "%";
    document.getElementById("hufflepuff").innerText = percent(data.hufflepuff) + "%";
  });
</script>

</body>
</html>

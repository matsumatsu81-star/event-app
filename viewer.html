<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>寮別イラスト進捗</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin: 0;
  background: #000;
  color: white;
  text-align: center;
  font-family: sans-serif;
}

h1 {
  margin-top: 40px;
  font-size: 48px;
}

.container {
  margin-top: 40px;
  display: grid;
  grid-template-columns: 350px 350px;
  grid-template-rows: 350px 350px;
  gap: 70px;
  justify-content: center;
}

.card {
  background: #1e1e1e;
  border-radius: 40px;
  padding: 20px;
}

.img-wrap {
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 30px;
}

.img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: clip-path 0.8s ease;
}

.percent {
  margin-top: 15px;
  font-size: 40px;
  font-weight: bold;
}

.card.active {
  box-shadow: 0 0 60px gold;
}
</style>
</head>

<body>

<h1>寮別イラスト進捗</h1>

<div class="container">
  <div class="card" id="gryffindor"><img id="gryffindorImg" src="gryffindor.png"><div class="percent" id="gryffindorPercent"></div></div>
  <div class="card" id="slytherin"><img id="slytherinImg" src="slytherin.png"><div class="percent" id="slytherinPercent"></div></div>
  <div class="card" id="ravenclaw"><img id="ravenclawImg" src="ravenclaw.png"><div class="percent" id="ravenclawPercent"></div></div>
  <div class="card" id="hufflepuff"><img id="hufflepuffImg" src="hufflepuff.png"><div class="percent" id="hufflepuffPercent"></div></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "enji-event2025.firebaseapp.com",
  projectId: "enji-event2025"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const MAX_POINTS = 15;

function isClosed() {
  const now = new Date();
  const d = new Date();
  d.setHours(14,30,0,0);
  return now >= d;
}

let fixedData = null;
let alreadyClosed = false;

const saved = localStorage.getItem("finalData");
if (saved) {
  fixedData = JSON.parse(saved);
  alreadyClosed = true;
}

db.collection("scores").doc("houses")
.onSnapshot(doc => {

  if (!doc.exists) return;
  const data = doc.data();

  const nowClosed = isClosed();

  if (nowClosed && !alreadyClosed) {
    fixedData = data;
    localStorage.setItem("finalData", JSON.stringify(data));
    alreadyClosed = true;
    render(fixedData);
    return;
  }

  if (nowClosed) {
    render(fixedData);
    return;
  }

  render(data);
});

function render(data) {
  const g = data.gryffindor || 0;
  const s = data.slytherin || 0;
  const r = data.ravenclaw || 0;
  const h = data.hufflepuff || 0;

  update("gryffindor", g);
  update("slytherin", s);
  update("ravenclaw", r);
  update("hufflepuff", h);

  const max = Math.max(g,s,r,h);
  document.querySelectorAll(".card").forEach(c=>c.classList.remove("active"));

  if (g===max && max!==0) document.getElementById("gryffindor").classList.add("active");
  if (s===max && max!==0) document.getElementById("slytherin").classList.add("active");
  if (r===max && max!==0) document.getElementById("ravenclaw").classList.add("active");
  if (h===max && max!==0) document.getElementById("hufflepuff").classList.add("active");
}

function update(id, point){
  const percent = Math.min((point / MAX_POINTS) * 100, 100);

  document.getElementById(id+"Percent").innerText =
    percent.toFixed(1) + "%";

  document.getElementById(id+"Img")
    .style.clipPath = `inset(${100 - percent}% 0 0 0)`;
}
</script>

</body>
</html>
